name: CI
on:
  push:
    branches: [main, feat/voice-message]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: git diff --exit-code -- client.js
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
